<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --navy:#042C53;--navy-mid:#185FA5;--navy-light:#E6F1FB;
    --green:#2D7A3A;--green-light:#EAF3DE;
    --amber:#633806;--amber-light:#FAEEDA;--amber-border:#FAC775;
    --red:#991B1B;--red-light:#FEF2F2;--red-border:#FECACA;
    --text:#0F1923;--text-mid:#4B5563;--text-soft:#9CA3AF;
    --border:#E5E7EB;--border-mid:#D1D5DB;
    --bg:#F8F9FA;--surface:#FFFFFF;
    --radius:8px;--radius-lg:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);}
  .header{background:var(--navy);padding:0 1.5rem;height:52px;display:flex;align-items:center;justify-content:space-between;}
  .logo-wrap{display:flex;align-items:center;gap:10px;}
  .logo-mark{width:26px;height:26px;background:#fff;border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:var(--navy);}
  .header-title{font-size:13px;font-weight:500;color:rgba(255,255,255,0.9);}
  .header-date{font-size:11px;color:rgba(255,255,255,0.45);font-family:monospace;}
  .main{max-width:740px;margin:0 auto;padding:1.75rem 1.25rem 4rem;}
  .step{margin-bottom:1.75rem;}
  .step-header{display:flex;align-items:center;gap:12px;margin-bottom:.875rem;}
  .snum{width:24px;height:24px;border-radius:50%;background:var(--border);border:1.5px solid var(--border-mid);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text-soft);flex-shrink:0;}
  .snum.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .snum.done{background:var(--green-light);color:var(--green);border-color:#86EFAC;}
  .step-title{font-size:14px;font-weight:600;color:var(--text);}
  .step-body{margin-left:36px;}
  .drop-zone{border:1.5px dashed var(--border-mid);border-radius:var(--radius-lg);padding:2.25rem 2rem;text-align:center;cursor:pointer;transition:all .15s;background:var(--surface);}
  .drop-zone:hover,.drop-zone.over{background:var(--navy-light);border-color:var(--navy-mid);border-style:solid;}
  .drop-zone.success{background:var(--green-light);border-color:#86EFAC;border-style:solid;cursor:default;}
  .drop-zone.fail{background:var(--red-light);border-color:var(--red-border);border-style:solid;}
  .dz-icon{font-size:26px;margin-bottom:6px;}
  .dz-main{font-size:13px;font-weight:500;color:var(--text-mid);}
  .dz-sub{font-size:11px;color:var(--text-soft);margin-top:3px;}
  .dz-link{color:var(--navy-mid);text-decoration:underline;}
  .sec-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-soft);margin-bottom:7px;}
  .meter-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px;}
  .meter-card{border:1.5px solid var(--border);border-radius:var(--radius);padding:10px 12px;cursor:pointer;transition:all .15s;background:var(--surface);}
  .meter-card:hover{border-color:var(--navy-mid);background:var(--navy-light);}
  .meter-card.sel{border-color:var(--navy-mid);background:var(--navy-light);box-shadow:0 0 0 3px rgba(24,95,165,.15);}
  .mc-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-soft);margin-bottom:2px;}
  .mc-id{font-size:12px;font-weight:600;color:var(--text);font-family:monospace;}
  .mc-site{font-size:11px;color:var(--text-mid);margin-top:2px;}
  .tag{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:999px;margin-top:5px;}
  .tag-e{background:var(--navy-light);color:var(--navy-mid);}
  .tag-g{background:var(--green-light);color:var(--green);}
  .btn{padding:8px 18px;background:var(--navy);color:#fff;border:none;border-radius:var(--radius);font-size:12px;font-weight:600;cursor:pointer;transition:opacity .15s;margin-top:7px;}
  .btn:hover{opacity:.88;}
  .btn-block{display:block;width:100%;padding:12px;font-size:13px;margin-top:0;}
  .sum-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:7px;}
  .sum-row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;gap:12px;}
  .sum-lbl{color:var(--text-soft);flex-shrink:0;}
  .sum-val{font-weight:500;color:var(--text);text-align:right;}
  .sup-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:8px;}
  .sup-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
  .sup-name{font-size:12px;font-weight:600;color:var(--text);}
  .sup-meta{font-size:10px;color:var(--text-soft);font-family:monospace;}
  .flag{font-size:10px;padding:2px 8px;border-radius:999px;background:var(--amber-light);color:var(--amber);border:1px solid var(--amber-border);margin-bottom:3px;display:inline-block;margin-right:3px;}
  .sup-drop{border:1.5px dashed var(--border-mid);border-radius:var(--radius);padding:9px 12px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:9px;font-size:11px;color:var(--text-mid);margin-top:5px;}
  .sup-drop:hover,.sup-drop.over{background:var(--navy-light);border-color:var(--navy-mid);}
  .sup-drop.success{background:var(--green-light);border-color:#86EFAC;border-style:solid;color:var(--green);cursor:default;}
  .sup-drop.fail{background:var(--red-light);border-color:var(--red-border);border-style:solid;color:var(--red);cursor:pointer;}
  .sdi{font-size:14px;flex-shrink:0;}
  .sdt{flex:1;}
  .sdtype{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-soft);}
  .sup-drop.success .sdtype{color:var(--green);opacity:.7;}
  .rates-row{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:7px;}
  .rc{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:5px 7px;}
  .rc-lbl{font-size:9px;color:var(--text-soft);margin-bottom:1px;}
  .rc-val{font-size:11px;font-weight:600;color:var(--text);font-family:monospace;}
  .term-pill{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--navy);color:#fff;margin:5px 3px 3px 0;}
  hr{border:none;border-top:1px solid var(--border);margin:1.25rem 0;}
</style>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="header">
  <div class="logo-wrap">
    <div class="logo-mark">PEP</div>
    <span class="header-title">Quote Tool</span>
  </div>
  <span class="header-date" id="hdr-date"></span>
</div>
<div class="main">
  <div class="step">
    <div class="step-header"><div class="snum active" id="s1n">1</div><span class="step-title">Upload site list</span></div>
    <div class="step-body">
      <div class="drop-zone" id="dz-site" ondragover="dzOver(event,'dz-site')" ondragleave="dzLeave(event,'dz-site')" ondrop="dzDrop(event,'dz-site',handleSiteList)" onclick="document.getElementById('inp-site').click()">
        <div class="dz-icon">📋</div>
        <div class="dz-main">Drop your site list here</div>
        <div class="dz-sub">or <span class="dz-link">browse to upload</span> · .xlsx only</div>
      </div>
      <input type="file" id="inp-site" accept=".xlsx" style="display:none" onchange="handleSiteList(this.files[0])">
    </div>
  </div>
  <div class="step" id="step2" style="display:none">
    <div class="step-header"><div class="snum" id="s2n">2</div><span class="step-title">Select meters to price</span></div>
    <div class="step-body">
      <div id="meter-grid"></div>
      <button class="btn" onclick="confirmMeters()">Confirm selection →</button>
    </div>
  </div>
  <div class="step" id="step3" style="display:none">
    <div class="step-header"><div class="snum" id="s3n">3</div><span class="step-title">Site details</span></div>
    <div class="step-body" id="site-summary"></div>
  </div>
  <div class="step" id="step4" style="display:none">
    <div class="step-header"><div class="snum" id="s4n">4</div><span class="step-title">Upload supplier quotes</span></div>
    <div class="step-body">
      <div id="supplier-cards"></div>
      <hr>
      <button class="btn btn-block" onclick="generateQuote()">Generate quote sheet →</button>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(()=>{const d=new Date();document.getElementById('hdr-date').textContent=d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'long',year:'numeric'});})();

let siteData={},meters=[],selectedMeters=[],parsedSuppliers={};

const PROXY_URL = 'https://pep-quote-proxy.onrender.com'; // e.g. https://pep-quote-proxy.onrender.com

const SUPPLIERS=[
  {name:'British Gas',              terms:['12','24','36'],accept:'.pdf', fmt:'britishgas'},
  {name:'Dyce Energy',              terms:['12','24','36'],accept:'.xlsx',fmt:'dyce'},
  {name:'Volter',                   terms:['12','24'],     accept:'.xlsx',fmt:'volter'},
  {name:'Marble Power',             terms:['12','24'],     accept:'.xlsx',fmt:'marble'},
  {name:'npower Business Solutions',terms:['12','24','36'],accept:'.pdf', fmt:'npower'},
  {name:'Smartest Energy',          terms:['12','24','36'],accept:'.xlsx',fmt:'smartest'},
  {name:'EDF Energy',               terms:['12','24','36'],accept:'.csv', fmt:'edf'},
  {name:'SSE Energy Solutions',     terms:['12','24','36'],accept:'.pdf', fmt:'sse'},
  {name:'Crown Gas & Power',        terms:['12','24','36'],accept:'.xlsx',fmt:'crown'},
];

const FLAGS={
  'British Gas':['0.5p/kWh broker commission included in unit rates — flag to client'],
  'Dyce Energy':['0.5p/kWh unit rate uplift embedded — flag to client'],
  'Volter':['Day/night rates include GMS discount — show pre/post figures to client','Passthroughs: CCL, DUoS Exceeded Capacity, DUoS Reactive Power, Meter Agent Charges'],
  'npower Business Solutions':['0.5p/kWh consultant fee in unit rate — flag to client','Day/night split 06:30–00:30 / 00:30–06:30 — differs from other suppliers'],
  'EDF Energy':['0.5p/kWh consultant uplift (CUP 0.5) — flag to client','Confirm "CT Fully Inclusive" is fixed before presenting'],
  'SSE Energy Solutions':['"Protect" + SSE Green — not standard fixed — flag to client'],
  'Smartest Energy':['0.6p/kWh added to day and night rates (excluded charges)','Flag if product is not standard fixed'],
};

const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;};
function dateStr(v){if(!v)return'';let d;if(v instanceof Date)d=v;else if(typeof v==='number')d=new Date(Math.round((v-25569)*86400*1000));else d=new Date(v);if(isNaN(d))return String(v);return`${pad(d.getUTCDate())}/${pad(d.getUTCMonth()+1)}/${d.getUTCFullYear()}`;}

// Strip commas and convert to number reliably
function toNum(v){return parseFloat(String(v).replace(/,/g,'').trim())||0;}
const r2=n=>Math.round(toNum(n)*100)/100;
const r4=n=>Math.round(toNum(n)*10000)/10000;

function cv(ws,col,row){const c=ws[XLSX.utils.encode_cell({r:row-1,c:col-1})];return c?c.v:null;}
function markDone(id){const el=document.getElementById(id);el.className='snum done';el.textContent='✓';}
function markActive(id){document.getElementById(id).className='snum active';}
function show(id){document.getElementById(id).style.display='block';}
function dzOver(e,id){e.preventDefault();e.stopPropagation();document.getElementById(id).classList.add('over');}
function dzLeave(e,id){e.preventDefault();document.getElementById(id).classList.remove('over');}
function dzDrop(e,id,handler){e.preventDefault();e.stopPropagation();document.getElementById(id).classList.remove('over');const f=e.dataTransfer.files[0];if(f)handler(f);}

// Parse DD/MM/YYYY string to Date
function parseDMY(s){if(!s)return null;const p=String(s).trim().split('/');if(p.length===3)return new Date(p[2],p[1]-1,p[0]);return null;}
function monthsBetween(s,e){if(!s||!e)return null;const ms=s instanceof Date?s:parseDMY(s);const me=e instanceof Date?e:parseDMY(e);if(!ms||!me||isNaN(ms)||isNaN(me))return null;return Math.round((me-ms)/(1000*60*60*24*30.44));}

function handleSiteList(file){
  if(!file)return;
  const z=document.getElementById('dz-site');
  z.innerHTML=`<div class="dz-icon">⏳</div><div class="dz-main">Parsing ${file.name}...</div>`;
  const r=new FileReader();
  r.onload=e=>{
    try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});parseSheet(wb.Sheets[wb.SheetNames[0]],file.name);}
    catch(err){z.className='drop-zone fail';z.innerHTML=`<div class="dz-icon">⚠️</div><div class="dz-main">Could not parse file</div>`;}
  };
  r.readAsArrayBuffer(file);
}

function parseSheet(ws,filename){
  meters=[];selectedMeters=[];
  const range=XLSX.utils.decode_range(ws['!ref']||'A1:N30');
  const maxRow=range.e.r+1;
  const b1=cv(ws,2,1);
  siteData.clientName=b1&&String(b1).includes('Site List -')?String(b1).replace('Site List -','').trim():'';
  let section=null,hdrRow=null;
  for(let r=1;r<=maxRow;r++){
    const a=String(cv(ws,1,r)||'').trim(),b=String(cv(ws,2,r)||'').trim();
    if(a==='Electricity'){section='elec';hdrRow=null;continue;}
    if(a==='Gas'){section='gas';hdrRow=null;continue;}
    if(!section)continue;
    if(a==='Site'&&(b==='MPAN'||b==='MPR')){hdrRow=r;continue;}
    if(!hdrRow)continue;
    if(a.startsWith('(')||b.startsWith('('))continue;
    if(!a||!b||b.length<3)continue;
    const hasData=cv(ws,7,r)||cv(ws,8,r)||cv(ws,9,r)||cv(ws,6,r);
    if(!hasData&&a.length>40)continue;
    const nextB=String(cv(ws,2,r+1)||'').trim();
    const fullMpan=nextB.length>b.length?nextB:b;
    const fullAddress=String(cv(ws,1,r+1)||a).trim();
    meters.push({type:section,site:a,fullAddress,idPrefix:b,fullMpan,
      supplier:cv(ws,6,r)||'',asc:cv(ws,7,r)||'',sc:cv(ws,8,r)||'',
      dayRate:cv(ws,9,r)||'',nightRate:cv(ws,10,r)||'',usage:cv(ws,11,r)||'',
      startDate:cv(ws,12,r)||'',endDate:cv(ws,13,r)||''});
  }
  const z=document.getElementById('dz-site');
  if(!meters.length){z.className='drop-zone fail';z.innerHTML=`<div class="dz-icon">⚠️</div><div class="dz-main">No meters found — check file format</div>`;return;}
  z.className='drop-zone success';
  z.innerHTML=`<div class="dz-icon">✅</div><div class="dz-main" style="color:var(--green);font-weight:600">${filename}</div><div class="dz-sub" style="color:var(--green)">Found ${meters.length} meter${meters.length!==1?'s':''}</div>`;
  markDone('s1n');markActive('s2n');
  buildMeterGrid();show('step2');
  document.getElementById('step2').scrollIntoView({behavior:'smooth',block:'start'});
}

function buildMeterGrid(){
  const elec=meters.filter(m=>m.type==='elec'),gas=meters.filter(m=>m.type==='gas');
  let h='';
  if(elec.length){h+=`<div class="sec-label">⚡ Electricity</div><div class="meter-grid">`;elec.forEach(m=>{const i=meters.indexOf(m);h+=mCard(i,m,'MPAN','e');});h+=`</div>`;}
  if(gas.length){h+=`<div class="sec-label">🔥 Gas</div><div class="meter-grid">`;gas.forEach(m=>{const i=meters.indexOf(m);h+=mCard(i,m,'MPR','g');});h+=`</div>`;}
  document.getElementById('meter-grid').innerHTML=h;
}
function mCard(idx,m,label,type){
  return`<div class="meter-card" id="mc-${idx}" onclick="toggleMeter(${idx})">
    <div class="mc-lbl">${label}</div><div class="mc-id">${m.fullMpan||m.idPrefix}</div>
    <div class="mc-site">${m.site}</div><span class="tag tag-${type}">${type==='e'?'Electricity':'Gas'}</span>
  </div>`;
}
function toggleMeter(idx){const c=document.getElementById(`mc-${idx}`),p=selectedMeters.indexOf(idx);if(p===-1){selectedMeters.push(idx);c.classList.add('sel');}else{selectedMeters.splice(p,1);c.classList.remove('sel');}}

function confirmMeters(){
  if(!selectedMeters.length){alert('Please select at least one meter.');return;}
  markDone('s2n');markDone('s3n');markActive('s4n');
  const tpl=selectedMeters.filter(i=>meters[i].type==='elec').length>1?'Multisite':'Single site';
  let h=`<div class="sum-card">
    <div class="sum-row"><span class="sum-lbl">Client</span><span class="sum-val">${siteData.clientName||'Unknown'}</span></div>
    <div class="sum-row"><span class="sum-lbl">Template</span><span class="sum-val">${tpl} quote</span></div>
    <div class="sum-row"><span class="sum-lbl">Meters selected</span><span class="sum-val">${selectedMeters.length}</span></div>
  </div>`;
  selectedMeters.forEach(idx=>{
    const m=meters[idx];
    h+=`<div class="sum-card">
      <div class="sum-row"><span class="sum-lbl">${m.type==='elec'?'MPAN':'MPR'}</span><span class="sum-val" style="font-family:monospace;font-size:11px">${m.fullMpan||m.idPrefix}</span></div>
      <div class="sum-row"><span class="sum-lbl">Site</span><span class="sum-val">${m.site}</span></div>
      ${m.asc?`<div class="sum-row"><span class="sum-lbl">ASC</span><span class="sum-val">${m.asc} kVA</span></div>`:''}
      ${m.usage?`<div class="sum-row"><span class="sum-lbl">Annual usage</span><span class="sum-val">${Number(m.usage).toLocaleString()} kWh</span></div>`:''}
      ${m.supplier?`<div class="sum-row"><span class="sum-lbl">Current supplier</span><span class="sum-val">${m.supplier}</span></div>`:''}
      ${m.sc?`<div class="sum-row"><span class="sum-lbl">Current SC</span><span class="sum-val">${r2(m.sc)} p/day</span></div>`:''}
      ${m.dayRate?`<div class="sum-row"><span class="sum-lbl">Current day rate</span><span class="sum-val">${r4(m.dayRate)} p/kWh</span></div>`:''}
      ${m.nightRate?`<div class="sum-row"><span class="sum-lbl">Current night rate</span><span class="sum-val">${r4(m.nightRate)} p/kWh</span></div>`:''}
      ${m.endDate?`<div class="sum-row"><span class="sum-lbl">Contract end</span><span class="sum-val">${dateStr(m.endDate)}</span></div>`:''}
    </div>`;
  });
  document.getElementById('site-summary').innerHTML=h;
  show('step3');buildSupplierCards();show('step4');
  document.getElementById('step4').scrollIntoView({behavior:'smooth',block:'start'});
}

function buildSupplierCards(){
  parsedSuppliers={};let h='';
  SUPPLIERS.forEach(sup=>{
    const key=sup.name.replace(/[^a-z0-9]/gi,'_'),flags=FLAGS[sup.name]||[],ft=sup.accept.replace(/\./g,'').toUpperCase();
    h+=`<div class="sup-card">
      <div class="sup-hdr"><span class="sup-name">${sup.name}</span><span class="sup-meta">${ft} · ${sup.terms.join('m, ')}m</span></div>`;
    if(flags.length){flags.forEach(f=>{h+=`<div class="flag">⚠ ${f}</div>`;});h+=`<div style="height:5px"></div>`;}
    h+=`<div class="sup-drop" id="sd-${key}" ondragover="sdOver(event,'${key}')" ondragleave="sdLeave(event,'${key}')" ondrop="sdDrop(event,'${key}','${sup.fmt}','${sup.name}')" onclick="document.getElementById('si-${key}').click()">
        <span class="sdi">📁</span><span class="sdt">Drop quote file(s) here or <span class="dz-link">browse</span> — drop one per term</span><span class="sdtype">${ft}</span>
      </div>
      <input type="file" id="si-${key}" accept="${sup.accept}" style="display:none" multiple onchange="handleSupFiles(this.files,'${key}','${sup.fmt}','${sup.name}')">
      <div id="rates-${key}"></div>
    </div>`;
  });
  document.getElementById('supplier-cards').innerHTML=h;
}

function sdOver(e,k){e.preventDefault();e.stopPropagation();document.getElementById(`sd-${k}`).classList.add('over');}
function sdLeave(e,k){e.preventDefault();document.getElementById(`sd-${k}`).classList.remove('over');}
function sdDrop(e,k,fmt,name){e.preventDefault();e.stopPropagation();document.getElementById(`sd-${k}`).classList.remove('over');const files=e.dataTransfer.files;if(files&&files.length)handleSupFiles(files,k,fmt,name);}

function handleSupFiles(files,key,fmt,name){
  if(!files||!files.length)return;
  const sd=document.getElementById(`sd-${key}`);
  sd.innerHTML=`<span class="sdi">⏳</span><span class="sdt">Parsing ${files.length} file${files.length>1?'s':''}...</span>`;
  // For PDF suppliers process sequentially
  if(['britishgas','npower','sse'].includes(fmt)){
    // PDFs are single-file multi-term, just use first file
    parsePDF(files[0],key,fmt,name);return;
  }
  // For xlsx/csv: parse each file and merge results
  const allResults={};
  let remaining=files.length;
  Array.from(files).forEach(file=>{
    const r=new FileReader();
    r.onload=e=>{
      try{
        let result;
        if(fmt==='edf'){result=parseEDF(new TextDecoder().decode(new Uint8Array(e.target.result)));}
        else{const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
          if(fmt==='volter')result=parseVolter(wb);
          else if(fmt==='marble')result=parseMarble(wb);
          else if(fmt==='smartest')result=parseSmartestEnergy(wb);
          else if(fmt==='crown')result=parseCrown(wb);
          else if(fmt==='dyce')result=parseDyce(wb);
        }
        if(result)Object.assign(allResults,result);
      }catch(err){console.error('Parse error:',err);}
      remaining--;
      if(remaining===0){
        if(Object.keys(allResults).length){parsedSuppliers[name]=allResults;showRates(key,allResults);}
        else sdFail(key,'No rates found — check file format');
      }
    };
    r.readAsArrayBuffer(file);
  });
}

function handleSupFile(file,key,fmt,name){
  handleSupFiles([file],key,fmt,name);
}

function sdFail(key,msg){const sd=document.getElementById(`sd-${key}`);sd.className='sup-drop fail';sd.innerHTML=`<span class="sdi">⚠️</span><span class="sdt">${msg} — click to retry</span>`;}

function showRates(key,result){
  const sd=document.getElementById(`sd-${key}`);sd.className='sup-drop success';
  const terms=Object.keys(result);
  sd.innerHTML=`<span class="sdi">✅</span><span class="sdt" style="font-weight:600">Parsed — ${terms.map(t=>t+'m').join(', ')}</span>`;
  let h='';
  terms.forEach(term=>{
    const d=result[term];
    h+=`<div><span class="term-pill">${term}m</span></div>
    <div class="rates-row">
      <div class="rc"><div class="rc-lbl">Standing charge</div><div class="rc-val">${d.sc??'—'} p/day</div></div>
      <div class="rc"><div class="rc-lbl">Capacity</div><div class="rc-val">${d.cap??'—'} £/kVA/mo</div></div>
      <div class="rc"><div class="rc-lbl">Day rate</div><div class="rc-val">${d.day??'—'} p/kWh</div></div>
      <div class="rc"><div class="rc-lbl">Night rate</div><div class="rc-val">${d.night??'—'} p/kWh</div></div>
    </div>`;
  });
  document.getElementById(`rates-${key}`).innerHTML=h;
}

// ── Parsers ──────────────────────────────────────────────────────────────────

function parseVolter(wb){
  const result={};
  wb.SheetNames.forEach(sn=>{
    const term=sn.trim();if(!['12','24'].includes(term))return;
    const data=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
    let sc,cap,day,night;
    data.forEach(row=>{const a=String(row[0]||'').toLowerCase(),b=toNum(row[1]);
      if(a.includes('standing'))sc=r2(b*100);
      if(a.includes('capacity'))cap=r4(b/100*365/12);
      if(a.includes('day')&&!a.includes('night'))day=r2(b);
      if(a.includes('night'))night=r2(b);
    });
    if(sc||day)result[term]={sc,cap,day,night};
  });
  return result;
}

function parseMarble(wb){
  // Format: sheet "Quote Details"
  // Row 1: quote ref + date range e.g. "Q00128771  01/10/2026 - 30/09/2027"
  // Row 7: headers — MPAN, SITE, VOLUME, CAPACITY(KVA), STANDING CHARGE(p/day), DAY UNIT(p/KWh), NIGHT UNIT(p/KWh), CAPACITY(p/KVA/day)
  // Row 8: data — values may be strings with commas
  // Cols: A=MPAN, B=SITE, C=VOL, D=CAP KVA, E=SC(p/day), F=DAY, G=NIGHT, H=CAP(p/kVA/day)
  const ws=wb.Sheets['Quote Details']||wb.Sheets[wb.SheetNames[0]];
  const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
  // raw:false means all values come as formatted strings — good for comma-separated numbers
  const result={};

  // Get term from row 1 col A — parse date range
  const titleRow=data[0]||[];
  const titleStr=String(titleRow[0]||'');
  // Extract dates from pattern "DD/MM/YYYY - DD/MM/YYYY"
  const dateMatch=titleStr.match(/(\d{2}\/\d{2}\/\d{4})\s*-\s*(\d{2}\/\d{2}\/\d{4})/);
  let term='12';
  if(dateMatch){
    const mo=monthsBetween(parseDMY(dateMatch[1]),parseDMY(dateMatch[2]));
    if(mo)term=String(mo);
  }

  // Data is on row 8 (index 7), cols E,F,G,H (indices 4,5,6,7)
  const dataRow=data[7]||[];
  const sc=r2(toNum(dataRow[4]));   // STANDING CHARGE p/day
  const day=r2(toNum(dataRow[5]));  // DAY UNIT p/kWh
  const night=r2(toNum(dataRow[6]));// NIGHT UNIT p/kWh
  const capRaw=toNum(dataRow[7]);    // CAPACITY p/kVA/day
  const cap=r4(capRaw/100*365/12);

  if(sc||day)result[term]={sc,cap,day,night};
  return result;
}

function parseSmartestEnergy(wb){
  const ws=wb.Sheets['Tariff Information']||wb.Sheets[wb.SheetNames[0]];
  const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  let sc,cap,day,night,term='12';
  data.forEach(row=>{const a=String(row[0]||'').toLowerCase(),b=toNum(row[1]);
    if(a.includes('standing'))sc=r2(b*100);
    if(a.includes('capacity'))cap=r4(b/100*365/12);
    if(a.includes('day rate'))day=r2(b+0.6);
    if(a.includes('night rate'))night=r2(b+0.6);
    if((a.includes('start date')||a.includes('supply start'))&&row[1]&&row[2]){
      const mo=monthsBetween(row[1],row[2]);if(mo)term=String(mo);
    }
  });
  return(sc||day)?{[term]:{sc,cap,day,night}}:{};
}

function parseEDF(text){
  const lines=text.split('\n'),hdrs=lines[0].split(',').map(h=>h.replace(/"/g,'').trim()),result={};
  for(let i=1;i<lines.length;i++){
    if(!lines[i].trim())continue;
    const vals=lines[i].split(',').map(v=>v.replace(/"/g,'').trim()),row={};
    hdrs.forEach((h,ci)=>{row[h]=vals[ci];});
    const sStr=row['Earliest Supply Start Date']||row['Supply Start Date']||'';
    const eStr=row['Earliest Supply End Date']||row['Supply End Date']||'';
    let term='12';
    if(sStr&&eStr){const mo=monthsBetween(new Date(sStr),new Date(eStr));if(mo)term=String(mo);}
    const sc=r2(toNum(row['Standing Charge']));
    const cap=r4(toNum(row['Capacity Charge'])/100*365/12);
    let day,night;
    for(let ri=1;ri<=20;ri++){const label=String(row[`Rate ${ri} Description`]||'').toUpperCase(),val=toNum(row[`Rate ${ri}`]);if(label.includes('DAY')&&day===undefined)day=r2(val);if(label.includes('NIGHT')&&night===undefined)night=r2(val);}
    if(sc||day)result[term]={sc,cap,day,night};
  }
  return result;
}

function parseCrown(wb){
  // Format: sheet "HH", headers on row 1, data on row 2
  // Key cols: L=Contract Start Date, M=Contract End Date (strings DD/MM/YYYY)
  // S=Indicative Availability Capacity Charge (p/kVA/day)
  // U=Standing Charge (£/per day) → ×100 to get p/day
  // V=Unit Charge Day (pence/kWh), W=Unit Charge Night (pence/kWh)
  const ws=wb.Sheets['HH']||wb.Sheets[wb.SheetNames[0]];
  // Use raw:false so dates stored as strings come through as strings
  const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
  const result={};
  if(data.length<2)return result;

  // Find header row (row with 'Contract Start Date')
  let hdrIdx=0;
  for(let i=0;i<Math.min(5,data.length);i++){
    if(data[i].some(v=>String(v).includes('Contract Start')||String(v).includes('Standing Charge'))){hdrIdx=i;break;}
  }
  const hdrs=data[hdrIdx].map(v=>String(v).trim());

  // Map column names to indices
  const idx={};
  hdrs.forEach((h,ci)=>{
    const hl=h.toLowerCase();
    if(hl.includes('contract start'))idx.start=ci;
    if(hl.includes('contract end')||hl.includes('end date'))idx.end=ci;
    if(hl.includes('availability capacity')||hl.includes('availability cap'))idx.cap=ci;
    if(hl.includes('standing charge'))idx.sc=ci;
    if(hl.includes('unit charge day')||hl==='day')idx.day=ci;
    if(hl.includes('unit charge night')||hl==='night')idx.night=ci;
  });

  // Process each data row after header
  for(let di=hdrIdx+1;di<data.length;di++){
    const dr=data[di];
    const scVal=idx.sc!==undefined?dr[idx.sc]:null;
    const dayVal=idx.day!==undefined?dr[idx.day]:null;
    if(!scVal&&!dayVal)continue;

    const startStr=idx.start!==undefined?dr[idx.start]:'';
    const endStr=idx.end!==undefined?dr[idx.end]:'';
    let term='12';
    if(startStr&&endStr){
      // Dates may be DD/MM/YYYY strings or date objects
      const mo=monthsBetween(startStr,endStr);
      if(mo)term=String(mo);
    }

    // SC is in £/day → ×100 for p/day
    const sc=r2(toNum(scVal)*100);
    const cap=r4(toNum(idx.cap!==undefined?dr[idx.cap]:0)/100*365/12);
    const day=r2(toNum(dayVal));
    const night=r2(toNum(idx.night!==undefined?dr[idx.night]:0));
    result[term]={sc,cap,day,night};
  }
  return result;
}

function parseDyce(wb){
  const ws=wb.Sheets['HH Quotation']||wb.Sheets[wb.SheetNames[0]];
  const result={};
  [{term:'12',scC:15,dayC:16,nightC:17,kvaC:18},{term:'24',scC:22,dayC:23,nightC:24,kvaC:25},{term:'36',scC:29,dayC:30,nightC:31,kvaC:32}].forEach(({term,scC,dayC,nightC,kvaC})=>{
    const sc=cv(ws,scC,10),day=cv(ws,dayC,10),night=cv(ws,nightC,10),kva=cv(ws,kvaC,10);
    if(sc&&day)result[term]={sc:r2(toNum(sc)),cap:r4(toNum(kva)/100*365/12),day:r2(toNum(day)),night:r2(toNum(night))};
  });
  return result;
}

async function parsePDF(file,key,fmt,name){
  if(!PROXY_URL||PROXY_URL==='YOUR_PROXY_URL_HERE'){
    sdFail(key,'Proxy not configured — see README to set up the proxy server');
    return;
  }
  const base64=await new Promise(res=>{const r=new FileReader();r.onload=e=>res(btoa(String.fromCharCode(...new Uint8Array(e.target.result))));r.readAsArrayBuffer(file);});
  const prompts={
    britishgas:`Extract electricity tariff rates from this British Gas PDF quote. Multiple terms (12m,24m,36m) each with a Site Annexe table. Return JSON only, no markdown. Format: {"12":{"sc":number,"cap":number,"day":number,"night":number},"24":{...},"36":{...}}. Standing Charge already in p/day. Availability Charge in p/kVA/day — convert ÷100×365÷12 to get £/kVA/month. Unit rates already in p/kWh. Include only terms present.`,
    npower:`Extract electricity tariff rates from this npower Business Solutions PDF. Return JSON only, no markdown. Format: {"12":{"sc":number,"cap":number,"day":number,"night":number},"24":{...},"36":{...}}. SC in p/day. Capacity in £/day/kVA — convert ×365÷12. Include only terms present.`,
    sse:`Extract electricity tariff rates from this SSE Energy Solutions PDF. Return JSON only, no markdown. Format: {"12":{"sc":number,"cap":number,"day":number,"night":number},"24":{...},"36":{...}}. SC in p/day. Capacity in p/kVA/day — store as-is. Use gross unit rates — ignore Direct Debit Discount line. Include only terms present.`,
  };
  try{
    const resp=await fetch(`${PROXY_URL}/parse-pdf`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({base64,prompt:prompts[fmt]})
    });
    if(!resp.ok){const e=await resp.json();throw new Error(e.error||'Proxy error');}
    const result=await resp.json();
    parsedSuppliers[name]=result;showRates(key,result);
  }catch(err){sdFail(key,'PDF parse failed: '+err.message);}
}

function generateQuote(){
  const lines=[`Today's date: ${today()}`,`Client: ${siteData.clientName||'Unknown'}`,''];
  const elecSel=selectedMeters.filter(i=>meters[i].type==='elec');
  lines.push(`Template: ${elecSel.length>1?'multisite':'single-site'}`,'','METER DATA:');
  selectedMeters.forEach(idx=>{
    const m=meters[idx];
    lines.push(`  Type: ${m.type==='elec'?'Electricity':'Gas'}`);
    lines.push(`  ${m.type==='elec'?'MPAN':'MPR'}: ${m.fullMpan||m.idPrefix}`);
    lines.push(`  MPAN top-line prefix: ${m.idPrefix}`);
    lines.push(`  Site: ${m.site}`,`  Full address: ${m.fullAddress}`);
    if(m.asc)lines.push(`  ASC: ${m.asc} kVA`);
    if(m.usage)lines.push(`  Annual usage: ${m.usage} kWh`);
    if(m.sc)lines.push(`  Current SC: ${m.sc} p/day`);
    if(m.dayRate)lines.push(`  Current day rate: ${m.dayRate} p/kWh`);
    if(m.nightRate)lines.push(`  Current night rate: ${m.nightRate} p/kWh`);
    if(m.startDate)lines.push(`  Contract start: ${dateStr(m.startDate)}`);
    if(m.endDate)lines.push(`  Contract end: ${dateStr(m.endDate)}`);
    if(m.supplier)lines.push(`  Current supplier: ${m.supplier}`);
    lines.push('');
  });
  lines.push('SUPPLIER QUOTES (post-conversion: p/day, £/kVA/month, p/kWh):');
  let any=false;
  SUPPLIERS.forEach(sup=>{
    const d=parsedSuppliers[sup.name];if(!d)return;
    Object.keys(d).forEach(term=>{
      const r=d[term];
      lines.push(`  ${sup.name} | ${term}m | SC: ${r.sc??'—'}p/day | Cap: ${r.cap??'—'}£/kVA/mo | Day: ${r.day??'—'}p/kWh | Night: ${r.night??'—'}p/kWh`);
      any=true;
    });
  });
  if(!any)lines.push('  (no supplier quotes uploaded yet)');
  const output=lines.join('\n');
  navigator.clipboard.writeText(output).then(()=>{alert('Quote data copied to clipboard!\n\nPaste it into your Claude chat to generate the Excel file.');}).catch(()=>{const ta=document.createElement('textarea');ta.value=output;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('Quote data copied to clipboard!\n\nPaste it into your Claude chat to generate the Excel file.');});
}
